<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Animation</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --square: #111111;
      --gap: 10px;
      --size: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Helvetica, Arial, sans-serif;
    }

    .stage {
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <div class="stage" aria-label="Two squares">
    <canvas id="scene" aria-label="Two blurred squares"></canvas>
  </div>
  <script>
    const canvas = document.getElementById("scene");
    const context = canvas.getContext("2d");

    function getVariable(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function drawBlurRampSquare(x, y, size, maxBlur, direction) {
      const samples = 220;
      const columnWidth = size / samples;

      for (let index = 0; index < samples; index += 1) {
        const progress = index / (samples - 1);
        const blurProgress = direction === "rtl" ? 1 - progress : progress;
        const blur = blurProgress * maxBlur;
        const columnX = x + (index * columnWidth);

        context.save();
        context.filter = `blur(${blur}px)`;
        context.fillStyle = getVariable("--square");
        context.fillRect(columnX, y, columnWidth + 0.6, size);
        context.restore();
      }
    }

    function render() {
      const size = Number.parseFloat(getVariable("--size"));
      const gap = Number.parseFloat(getVariable("--gap"));
      const maxBlur = 8;
      const bleed = maxBlur * 3;
      const width = (size * 2) + gap + (bleed * 2);
      const height = size + (bleed * 2);
      const ratio = window.devicePixelRatio || 1;

      canvas.width = Math.ceil(width * ratio);
      canvas.height = Math.ceil(height * ratio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;

      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);

      const leftX = bleed;
      const topY = bleed;
      const rightX = leftX + size + gap;

      drawBlurRampSquare(leftX, topY, size, maxBlur, "ltr");
      drawBlurRampSquare(rightX, topY, size, maxBlur, "ltr");
    }

    render();
    window.addEventListener("resize", render);
  </script>
</body>
</html>
