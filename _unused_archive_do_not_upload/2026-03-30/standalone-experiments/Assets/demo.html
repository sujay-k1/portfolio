<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Demo: Google Marathi suggestions + Mic (Safari iOS fallback)</title>
  <style>
    :root{
      --bg:#0b0c10;
      --ink:#e9ecf1;
      --muted:rgba(233,236,241,.72);
      --line:rgba(233,236,241,.12);
      --accent:rgba(124,92,255,.16);
      --r:18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--ink);
      background:
        radial-gradient(1200px 520px at 20% -10%, rgba(124,92,255,.22), transparent 60%),
        var(--bg);
      padding:24px 14px;
    }
    .wrap{max-width:760px; margin:0 auto;}

    .field{
      position:relative;
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.02);
      padding:10px 10px 10px 12px;
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
    }
    input{
      flex:1;
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--ink);
      font-size:18px;
      padding:10px 6px;
      min-width: 0;

      /* Make iOS happy */
      -webkit-text-size-adjust: 100%;
    }
    .iconBtn{
      border:1px solid var(--line);
      background: rgba(255,255,255,.02);
      color:var(--ink);
      width:44px;
      height:44px;
      border-radius: 16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-size: 18px;
      line-height: 1;
    }
    .iconBtn:active{ transform: translateY(1px); }
    .iconBtn.listening{
      border-color: rgba(255,92,122,.55);
      background: rgba(255,92,122,.10);
    }

    /* Suggestions dropdown */
    .suggest{
      position:absolute;
      left:10px; right:10px;
      top: calc(100% + 8px);
      background: rgba(17,19,26,.98);
      border:1px solid var(--line);
      border-radius: 16px;
      overflow:hidden;
      display:none;
      z-index: 99;
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
    }
    .opt{
      padding:12px 12px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      border-top:1px solid rgba(233,236,241,.08);
    }
    .opt:first-child{border-top:0}
    .opt:hover{ background: var(--accent); }
    .opt.active{ background: rgba(124,92,255,.22); }
    .dv{ font-size:18px; line-height:1.2; }
    .meta{ font-family:var(--mono); font-size:12px; color: rgba(233,236,241,.60); white-space:nowrap; }

    /* Tiny toast (only errors + iOS hint) */
    .toast{
      margin-top:10px;
      font-family: var(--mono);
      font-size:12px;
      color: rgba(233,236,241,.82);
      opacity:0;
      transform: translateY(-4px);
      transition: opacity .18s ease, transform .18s ease;
      white-space: pre-wrap;
    }
    .toast.show{
      opacity:1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="field">
    <input id="q"
      placeholder="Type a name…"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      inputmode="text"
    />
    <button id="mic" class="iconBtn" title="Voice input" aria-label="Voice input">🎙</button>
    <div id="suggest" class="suggest" role="listbox" aria-label="Suggestions"></div>
  </div>
  <div id="toast" class="toast"></div>
</div>

<script>
  // -------- Config --------
  const ITC = "mr-t-i0-und"; // Marathi (your preferred)
  const NUM = 5;
  const DEBOUNCE_MS = 90;

  function HIGH_CONFIDENCE(input, topCandidate){
    // Keep this gentle and non-annoying.
    const letters = (input.match(/[A-Za-z]/g) || []).length;
    return !!topCandidate && letters >= 2;
  }

  // -------- Elements --------
  const q = document.getElementById("q");
  const micBtn = document.getElementById("mic");
  const suggest = document.getElementById("suggest");
  const toast = document.getElementById("toast");

  // -------- Helpers --------
  const hasLatin = (s) => /[A-Za-z]/.test(s);
  const hasDevanagari = (s) => /[\u0900-\u097F]/.test(s);

  function showToast(msg, ms=2400){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), ms);
  }

  // --- Detect iOS Safari (not Chrome/Firefox wrappers) ---
  // We use this only to choose the "dictation hint" fallback.
  function isIOSSafari(){
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (!isIOS) return false;
    const isWebKit = /WebKit/i.test(ua);
    const isCriOS = /CriOS/i.test(ua);   // Chrome iOS
    const isFxiOS = /FxiOS/i.test(ua);   // Firefox iOS
    const isEdgiOS = /EdgiOS/i.test(ua); // Edge iOS
    // Safari on iOS = WebKit + not other branded browsers
    return isWebKit && !isCriOS && !isFxiOS && !isEdgiOS;
  }

  // Web Speech availability check
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // -------- Suggestion state --------
  let lastReqId = 0;
  let open = false;
  let items = [];
  let activeIndex = -1;
  let lastInputMode = "other"; // "latin" | "nonlatin" | "other"
  let lastKeyWasLatin = false;

  function hideSuggest(){
    open = false;
    items = [];
    activeIndex = -1;
    suggest.style.display = "none";
    suggest.innerHTML = "";
  }

  function paintActive(){
    const rows = [...suggest.querySelectorAll(".opt")];
    rows.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
  }

  function accept(i){
    const cand = items[i];
    if (!cand) return;
    q.value = cand;
    hideSuggest();
    lastInputMode = hasLatin(cand) ? "latin" : (hasDevanagari(cand) ? "nonlatin" : "other");
    // Hook: runSearch(q.value)
  }

  function renderSuggest(list){
    suggest.innerHTML = "";
    if (!list.length) { hideSuggest(); return; }

    list.forEach((cand, idx) => {
      const row = document.createElement("div");
      row.className = "opt";
      row.setAttribute("role","option");
      row.dataset.index = String(idx);

      const left = document.createElement("div");
      left.className = "dv";
      left.textContent = cand;

      const right = document.createElement("div");
      right.className = "meta";
      right.textContent = idx === 0 ? "top" : `#${idx+1}`;

      row.appendChild(left);
      row.appendChild(right);

      row.addEventListener("mousedown", (e) => { e.preventDefault(); accept(idx); });
      row.addEventListener("touchstart", (e) => { e.preventDefault(); accept(idx); }, { passive:false });

      suggest.appendChild(row);
    });

    items = list;
    activeIndex = 0;
    open = true;
    suggest.style.display = "block";
    paintActive();
  }

  async function fetchGoogleCandidates(text){
    const url = new URL("https://inputtools.google.com/request");
    url.searchParams.set("text", text);
    url.searchParams.set("itc", ITC);
    url.searchParams.set("num", String(NUM));
    url.searchParams.set("cp", "0");
    url.searchParams.set("cs", "1");
    url.searchParams.set("ie", "utf-8");
    url.searchParams.set("oe", "utf-8");
    url.searchParams.set("app", "test");

    const res = await fetch(url.toString(), { method: "GET" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (!Array.isArray(data) || data[0] !== "SUCCESS") return [];
    const payload = data[1] && data[1][0];
    const candidates = payload && payload[1];
    return Array.isArray(candidates) ? candidates.slice(0, NUM) : [];
  }

  function shouldShowSuggestionsNow(){
    return lastInputMode === "latin";
  }

  let timer = null;
  function scheduleSuggest(){
    clearTimeout(timer);

    const text = (q.value || "").trim();
    if (!text) { hideSuggest(); return; }
    if (!shouldShowSuggestionsNow()) { hideSuggest(); return; }

    timer = setTimeout(async () => {
      const current = (q.value || "").trim();
      if (!current || !shouldShowSuggestionsNow()) return;

      const reqId = ++lastReqId;
      try{
        const cands = await fetchGoogleCandidates(current);
        if (reqId !== lastReqId) return;

        const cleaned = cands.filter(x => x && x !== current);
        renderSuggest(cleaned);
      }catch(_){
        // Silent fallback strategy
        if (reqId !== lastReqId) return;
        hideSuggest();
      }
    }, DEBOUNCE_MS);
  }

  // Determine input mode from key presses
  q.addEventListener("keydown", (e) => {
    if (open) {
      if (e.key === "Escape") { e.preventDefault(); hideSuggest(); return; }
      if (e.key === "ArrowDown") { e.preventDefault(); activeIndex = Math.min(items.length - 1, activeIndex + 1); paintActive(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); activeIndex = Math.max(0, activeIndex - 1); paintActive(); return; }
      if (e.key === "Enter") {
        const current = (q.value || "").trim();
        const top = items[0];
        if (HIGH_CONFIDENCE(current, top)) {
          e.preventDefault();
          accept(activeIndex >= 0 ? activeIndex : 0);
          return;
        }
      }
    }

    if (e.key && e.key.length === 1) {
      if (/[A-Za-z]/.test(e.key)) { lastInputMode = "latin"; lastKeyWasLatin = true; }
      else if (/[\u0900-\u097F]/.test(e.key)) { lastInputMode = "nonlatin"; lastKeyWasLatin = false; }
    }
  });

  q.addEventListener("input", () => {
    const v = q.value || "";
    if (hasDevanagari(v) && !lastKeyWasLatin) lastInputMode = "nonlatin";
    scheduleSuggest();
  });

  q.addEventListener("paste", () => {
    setTimeout(() => {
      const v = q.value || "";
      if (hasLatin(v)) lastInputMode = "latin";
      else if (hasDevanagari(v)) lastInputMode = "nonlatin";
      else lastInputMode = "other";
      scheduleSuggest();
    }, 0);
  });

  document.addEventListener("mousedown", (e) => {
    if (!open) return;
    if (e.target === q || suggest.contains(e.target)) return;
    hideSuggest();
  });

  // -------- Mic --------
  let recognition = null;
  let listening = false;

  function ensureRecognizer(){
    if (!SR) return null;
    if (recognition) return recognition;

    const r = new SR();
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 5;
    r.lang = "hi-IN";

    r.onstart = () => {
      listening = true;
      micBtn.classList.add("listening");
    };
    r.onend = () => {
      listening = false;
      micBtn.classList.remove("listening");
    };
    r.onerror = (ev) => {
      // Common: not-allowed, no-speech, audio-capture
      showToast(`Voice error: ${ev.error || "unknown"}`);
    };
    r.onresult = async (ev) => {
      let finalAlts = null;
      let interim = "";

      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        const alts = [];
        for (let j = 0; j < res.length; j++) alts.push(res[j].transcript.trim());
        if (res.isFinal) finalAlts = alts;
        else interim = alts[0] || interim;
      }

      if (interim && !finalAlts) {
        q.value = interim;
        hideSuggest();
        return;
      }

      if (!finalAlts || !finalAlts.length) return;

      const best = finalAlts[0];
      q.value = best;

      // If speech gives Latin -> show suggestions; if Devanagari -> just keep it.
      lastInputMode = hasLatin(best) ? "latin" : (hasDevanagari(best) ? "nonlatin" : "other");
      lastKeyWasLatin = false;

      if (lastInputMode !== "latin") {
        hideSuggest();
        return;
      }

      // Fetch suggestions for speech transcript (fallback-safe)
      try{
        const reqId = ++lastReqId;
        const cands = await fetchGoogleCandidates(best);
        if (reqId !== lastReqId) return;
        const cleaned = cands.filter(x => x && x !== best);
        renderSuggest(cleaned);
      }catch(_){
        hideSuggest();
      }
    };

    recognition = r;
    return r;
  }

  function iOSDictationFallback(){
    // iOS Safari: focus the field and instruct user to use keyboard mic.
    q.focus({ preventScroll: true });
    // Small delay helps ensure keyboard opens before the user reads the hint.
    setTimeout(() => {
      showToast("On iPhone Safari: tap the mic on your keyboard to dictate.");
    }, 50);
  }

  micBtn.addEventListener("click", () => {
    // iOS Safari fallback: built-in dictation
    if (isIOSSafari()) {
      iOSDictationFallback();
      return;
    }

    const r = ensureRecognizer();
    if (!r) {
      showToast("Voice typing not supported in this browser. Try Chrome.");
      return;
    }

    if (listening) {
      try { r.stop(); } catch(_) {}
      return;
    }

    hideSuggest();
    try { r.start(); } catch(e) { showToast("Could not start voice."); }
  });

  // Tiny UX: on first focus in iOS Safari, hint once (optional)
  if (isIOSSafari()) {
    // Don’t spam: only show if they tap mic or focus; leaving this off by default.
    // q.addEventListener("focus", () => showToast("Tip: use keyboard mic for dictation.", 1800), { once:true });
  }

  // Start neutral: suggestions appear once they type Latin.
  lastInputMode = "other";
</script>
</body>
</html>
